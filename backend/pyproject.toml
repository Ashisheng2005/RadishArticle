[project]
name = "radish-article"
version = "0.1.0"
description = "Novel automation workflow with DeepAgents and LLM Wiki"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6.0",
    "langgraph>=1.2.0",
    "langchain>=1.3.0",
    "langchain-openai>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.0.0",
    "chromadb>=0.5.0",
    "pyyaml>=6.0",
    "duckduckgo-search>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
radish = "cli.radish_article_cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*", "cli*"]
